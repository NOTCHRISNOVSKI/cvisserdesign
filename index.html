<!doctype html>
<html lang="nl" data-title="home.title" data-desc="home.desc">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CVisser Design | Showreel</title>
    <meta name="description" content="Christiaan Visser, designer en videograaf. Bekijk het showreel en het werk." />
    <meta name="theme-color" content="#000000" />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="nl_NL" />
    <meta property="og:title" content="CVisser Design | Showreel" />
    <meta property="og:description" content="Christiaan Visser, designer en videograaf. Bekijk het showreel en het werk." />
    <meta property="og:url" content="https://cvisserdesign.nl/" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <script>try{var l=localStorage.getItem('lang');if(l==='en'||(!l&&!/^nl/i.test(navigator.language||'nl')))document.documentElement.classList.add('pending')}catch(e){}</script>
  </head>
  <body class="home">
    <video id="reel" class="reel" autoplay muted loop playsinline preload="auto" poster="{{showreel-poster}}" src="{{showreel-src}}" aria-label="Showreel van Christiaan Visser" data-i18n-attr="aria-label:home.reel"></video>
    <div class="shade" aria-hidden="true"></div>

    {{header:home}}

    <main class="home-bottom">
      <p class="who"><strong>Christiaan Visser</strong><span data-i18n="home.role">Designer &amp; videograaf</span></p>
      <a class="cta" href="/work/"><span data-i18n="home.cta">Bekijk mijn werk</span> <span class="arrow" aria-hidden="true">→</span></a>
    </main>

    <script type="module" src="/src/home.js"></script>
  </body>
</html>
