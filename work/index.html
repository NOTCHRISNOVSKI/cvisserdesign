<!doctype html>
<html lang="nl" data-title="work.title" data-desc="work.desc">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Werk | CVisser Design</title>
    <meta name="description" content="Een selectie van mijn werk: design, video en fotografie." />
    <meta name="theme-color" content="#000000" />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="nl_NL" />
    <meta property="og:title" content="Werk | CVisser Design" />
    <meta property="og:description" content="Een selectie van mijn werk: design, video en fotografie." />
    <meta property="og:url" content="https://cvisserdesign.nl/work/" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <script>try{var l=localStorage.getItem('lang');if(l==='en'||(!l&&!/^nl/i.test(navigator.language||'nl')))document.documentElement.classList.add('pending')}catch(e){}</script>
  </head>
  <body class="work">
    {{loader}}
    {{header:work}}

    <main>
      <section class="intro">
        <h1><span data-i18n="work.h1">Werk</span><span class="dot">.</span></h1>
        <p id="count" class="count" aria-live="polite"></p>
      </section>

      <div id="filters" class="filters" role="group" aria-label="Filter op categorie" data-i18n-attr="aria-label:work.filter"></div>

      <div id="grid" class="grid" aria-live="polite"></div>
      <p id="empty" class="empty" hidden data-i18n="work.empty">Nog geen werk in deze categorie.</p>
      <noscript><p class="empty">Zet JavaScript aan om het werk te bekijken.</p></noscript>
    </main>

    {{footer}}

    <script type="module" src="/src/work.js"></script>
  </body>
</html>
